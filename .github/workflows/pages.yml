# SEEDSED — pages.yml
# Purpose: test and publish the app/ folder to GitHub Pages. The speech model is fetched and
#          checksum-verified here at build time, so model weights never enter the repository.
# Boundaries: deploys only on pushes to main (or a manual run); a failing test stops the deploy.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and verify speech model
        run: ./scripts/fetch-model.sh
      - name: Run tests
        run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
